# Infraestructura de DESARROLLO de Comondurismo: PostgreSQL, Redis, almacenamiento de
# objetos compatible con S3 (RustFS) y un servidor de correo falso (Mailpit).
#
# Esta carpeta es independiente de los servicios: se puede mover fuera del repositorio.
# Los servicios (compose.yml en la raiz de cada repo) NO dependen de estos contenedores; los
# encuentran por las variables DATABASE_URL, REDIS_ADDR, SMTP_HOST... de su .env.
#
# PUERTOS: todo lo de Comondurismo usa el rango 50300-50400 de la maquina anfitriona (ver el
# documento "Puertos_y_Red" en la boveda de Obsidian). Dentro de la red de Docker cada pieza
# conserva su puerto habitual (postgres:5432, redis:6379, storage:9000...).
#
# NGINX no esta aqui: no es un servicio de Comondurismo. Lo configura el administrador del
# servidor (guia "Despliegue_y_Nginx" en la boveda).
#
#   cp .env.example .env        # y define las contrasenas
#   docker compose up -d
#
# En produccion estas piezas se reemplazan por servicios administrados y solo cambian
# los valores de las variables de entorno del servicio.

name: comondurismo-infra

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: comondurismo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Base del servicio de contenido; la crea postgres/initdb la primera vez que arranca.
      POSTGRES_CONTENT_DB: ${POSTGRES_CONTENT_DB:-comondurismo_content}
    ports:
      # Solo escucha en tu maquina (127.0.0.1): no se expone a la red.
      - "127.0.0.1:${POSTGRES_PORT:-50300}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comondurismo-network

  redis:
    image: redis:7-alpine
    container_name: comondurismo-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-50301}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - comondurismo-network

  # Almacenamiento de objetos compatible con S3 (RustFS) para las imagenes y videos del
  # servicio de contenido. En produccion se reemplaza por S3 o similar: solo cambian las
  # variables OBJECT_STORE_* del servicio. El servicio crea el bucket si
  # OBJECT_STORE_CREATE_BUCKET=true y lo deja de lectura publica.
  #   API S3 (y archivos publicos): http://localhost:50304/<bucket>/<clave>
  #   Consola web:                  http://localhost:50305
  # En produccion el administrador publica el bucket en /media/ con nginx.
  storage:
    image: rustfs/rustfs:1.0.1
    container_name: comondurismo-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://localhost:${S3_CONSOLE_PORT:-50305}"
    ports:
      # La API S3 sirve tambien los archivos publicos (imagenes de las fichas, logo de los
      # correos). Solo en tu maquina por defecto; para probar con otros equipos del
      # laboratorio pon S3_BIND_ADDRESS=0.0.0.0 en el .env. La consola siempre es local.
      - "${S3_BIND_ADDRESS:-127.0.0.1}:${S3_API_PORT:-50304}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-50305}:9001"
    volumes:
      - storage_data:/data
    networks:
      - comondurismo-network

  # Servidor SMTP de desarrollo: captura los correos sin enviarlos a nadie.
  # Interfaz web: http://localhost:50303   |   SMTP: puerto 50302
  mailpit:
    image: axllent/mailpit
    container_name: comondurismo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-50302}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-50303}:8025"
    networks:
      - comondurismo-network

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  # Red compartida con el servicio: tiene un nombre fijo para que otros compose
  # (el del servicio, el del contenido...) se conecten a ella como "externa".
  comondurismo-network:
    name: comondurismo-network
    driver: bridge
