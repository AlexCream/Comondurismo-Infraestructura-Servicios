# Infraestructura de DESARROLLO del servicio de identidad: PostgreSQL, Redis y un
# servidor de correo falso (Mailpit).
#
# Esta carpeta es independiente del servicio: se puede mover fuera del repositorio.
# El servicio (compose.yml en la raiz del repo) NO depende de estos contenedores; los
# encuentra por las variables DATABASE_URL, REDIS_ADDR y SMTP_HOST de su .env.
#
#   cp .env.example .env        # y define las contrasenas
#   docker compose up -d
#
# En produccion estas piezas se reemplazan por servicios administrados y solo cambian
# los valores de las variables de entorno del servicio.

name: comondurismo-infra

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: comondurismo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Base del servicio de contenido; la crea postgres/initdb la primera vez que arranca.
      POSTGRES_CONTENT_DB: ${POSTGRES_CONTENT_DB:-comondurismo_content}
    ports:
      # Solo escucha en tu maquina (127.0.0.1): no se expone a la red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comondurismo-network

  redis:
    image: redis:7-alpine
    container_name: comondurismo-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - comondurismo-network

  # Almacenamiento de objetos compatible con S3 (RustFS) para las imagenes y videos del
  # servicio de contenido. En produccion se reemplaza por S3 o similar: solo cambian las
  # variables OBJECT_STORE_* del servicio. El servicio crea el bucket si
  # OBJECT_STORE_CREATE_BUCKET=true. Los archivos se ven a traves del gateway:
  # http://localhost:8000/media/...    Consola web: http://localhost:9001
  storage:
    image: rustfs/rustfs:1.0.1
    container_name: comondurismo-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://localhost:${S3_CONSOLE_PORT:-9001}"
    ports:
      - "127.0.0.1:${S3_API_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage_data:/data
    networks:
      - comondurismo-network

  # Servidor SMTP de desarrollo: captura los correos sin enviarlos a nadie.
  # Interfaz web: http://localhost:8025   |   SMTP: puerto 1025
  mailpit:
    image: axllent/mailpit
    container_name: comondurismo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - comondurismo-network

  # Puerta de entrada: nginx reparte las peticiones a cada servicio segun la ruta
  # (ver gateway/ y la seccion "Gateway" del README). No depende de que los servicios
  # esten arriba: los resuelve por nombre en cada peticion.
  #   Salud del gateway: http://localhost:8000/gateway/health
  #   API de identidad:  http://localhost:8000/api/v1/...
  gateway:
    image: nginx:1.28-alpine
    container_name: comondurismo-gateway
    restart: unless-stopped
    environment:
      # Nombre con el que se responde. "_" = cualquiera (sirve sin dominio, por IP o localhost).
      GATEWAY_SERVER_NAME: ${GATEWAY_SERVER_NAME:-_}
      # Solo se sustituyen las variables GATEWAY_* en las plantillas (las $variables de
      # nginx quedan intactas).
      NGINX_ENVSUBST_FILTER: ^GATEWAY_
    ports:
      # Por defecto solo en tu maquina. Para exponerlo en la red / internet:
      # GATEWAY_BIND=0.0.0.0 (y en produccion GATEWAY_HTTP_PORT=80).
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HTTP_PORT:-8000}:80"
      # Con HTTPS (ver README, "Cuando tengas dominio"): descomenta esta linea y la de certs.
      # - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./gateway/templates:/etc/nginx/templates:ro
      - ./gateway/locations:/etc/nginx/locations:ro
      - ./gateway/snippets:/etc/nginx/snippets:ro
      # - ./gateway/certs:/etc/nginx/certs:ro
    extra_hosts:
      # Para proxiar al frontend de desarrollo que corre en tu maquina (Vite).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - comondurismo-network

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  # Red compartida con el servicio: tiene un nombre fijo para que otros compose
  # (el del servicio, el del contenido...) se conecten a ella como "externa".
  comondurismo-network:
    name: comondurismo-network
    driver: bridge
