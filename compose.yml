# Sistema Comondurismo completo, a partir de ESTE repositorio (no hace falta descargar ningun otro):
#
#   infraestructura    PostgreSQL/PostGIS, Redis y almacenamiento de objetos compatible con S3 (RustFS)
#   identity           servicio de identidad  (puerto 50310)
#   content            servicio de contenido  (puerto 50311)
#   mailpit            correo falso, SOLO desarrollo (perfil "dev")
#
# Los servicios NO se compilan aqui: se construyen copiando los binarios de bin/ a una imagen
# minima (Dockerfile). Los binarios los genera scripts/compilar-binarios.sh en la maquina de
# desarrollo y se versionan en este repositorio.
#
# PUERTOS: todo lo de Comondurismo usa el rango 50300-50400 de la maquina anfitriona (nota
# "Puertos_y_Red" de la boveda de Obsidian). Por defecto todo escucha solo en 127.0.0.1: el acceso
# desde internet lo da el nginx del administrador del servidor (NO es un servicio de Comondurismo;
# guia "Despliegue_y_Nginx" en la boveda).
#
# Primera vez (ver README.md):
#   cp .env.example .env                                  # secretos de la infraestructura
#   cp env/identity.env.example env/identity.env          # configuracion de identidad
#   cp env/content.env.example  env/content.env           # configuracion de contenido
#   docker compose build
#   docker compose run --rm identity /genkey > secrets/jwt-private.pem
#   docker compose up -d postgres redis storage
#   docker compose run --rm identity /migrate up
#   docker compose run --rm content  /migrate up
#   docker compose up -d

name: comondurismo-infra

# Endurecimiento y red comunes a los dos servicios: sistema de archivos de solo lectura, sin
# privilegios extra y sin capacidades de Linux.
x-servicio: &servicio
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - comondurismo-network

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: comondurismo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Base del servicio de contenido; la crea postgres/initdb la primera vez que arranca.
      POSTGRES_CONTENT_DB: ${POSTGRES_CONTENT_DB:-comondurismo_content}
    ports:
      # Solo escucha en tu maquina (127.0.0.1): no se expone a la red.
      - "127.0.0.1:${POSTGRES_PORT:-50300}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comondurismo-network

  redis:
    image: redis:7-alpine
    container_name: comondurismo-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-50301}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - comondurismo-network

  # Almacenamiento de objetos compatible con S3 (RustFS) para las imagenes y videos del
  # servicio de contenido. En produccion se puede reemplazar por S3 o similar: solo cambian las
  # variables OBJECT_STORE_* de contenido. El servicio crea el bucket si
  # OBJECT_STORE_CREATE_BUCKET=true y lo deja de lectura publica.
  #   API S3 (y archivos publicos): http://localhost:50304/<bucket>/<clave>
  #   Consola web:                  http://localhost:50305
  # En produccion el administrador publica el bucket en /media/ con nginx.
  storage:
    image: rustfs/rustfs:1.0.1
    container_name: comondurismo-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "http://localhost:${S3_CONSOLE_PORT:-50305}"
    ports:
      # La API S3 sirve tambien los archivos publicos (imagenes de las fichas, logo de los
      # correos). Solo en tu maquina por defecto; para probar con otros equipos del
      # laboratorio pon S3_BIND_ADDRESS=0.0.0.0 en el .env. La consola siempre es local.
      - "${S3_BIND_ADDRESS:-127.0.0.1}:${S3_API_PORT:-50304}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-50305}:9001"
    volumes:
      - storage_data:/data
    networks:
      - comondurismo-network

  # ---- Servicio de identidad ----
  # Cuentas, autenticacion, autorizacion y perfil. Emite los tokens (JWT Ed25519).
  # Configuracion: env/identity.env (plantilla env/identity.env.example). Las conexiones a
  # PostgreSQL, Redis y el puerto se fijan aqui a partir de .env y tienen prioridad sobre ese archivo.
  identity:
    <<: *servicio
    build:
      context: .
      target: identity
    image: comondurismo-identity:release
    container_name: comondurismo-identity
    env_file: ${IDENTITY_ENV_FILE:-./env/identity.env}
    environment:
      PORT: "50310"
      # Para una base administrada, define IDENTITY_DATABASE_URL en .env (con sslmode=require).
      DATABASE_URL: ${IDENTITY_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${IDENTITY_PORT:-50310}:50310"
    volumes:
      # Clave privada de firma de tokens, solo lectura. Se genera una vez con /genkey y no se versiona.
      - ${JWT_KEY_FILE:-./secrets/jwt-private.pem}:/run/secrets/jwt-private.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ---- Servicio de contenido ----
  # Catalogo turistico, negocios, multimedia, busqueda y sincronizacion. Verifica los tokens con
  # el JWKS de identidad (red interna, sin pasar por nginx).
  content:
    <<: *servicio
    build:
      context: .
      target: content
    image: comondurismo-content:release
    container_name: comondurismo-content
    env_file: ${CONTENT_ENV_FILE:-./env/content.env}
    environment:
      PORT: "50311"
      # Para una base administrada, define CONTENT_DATABASE_URL en .env (con sslmode=require).
      DATABASE_URL: ${CONTENT_DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_CONTENT_DB:-comondurismo_content}?sslmode=disable}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_JWKS_URL: http://comondurismo-identity:50310/.well-known/jwks.json
      OBJECT_STORE_ENDPOINT: storage:9000
      OBJECT_STORE_ACCESS_KEY: ${S3_ACCESS_KEY}
      OBJECT_STORE_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONTENT_PORT:-50311}:50311"
    # Las cargas de archivos grandes se escriben temporalmente aqui. Debe caber el video mas
    # grande permitido (MEDIA_MAX_VIDEO_MB).
    tmpfs:
      - /tmp:size=256m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Servidor SMTP de desarrollo: captura los correos sin enviarlos a nadie. SOLO desarrollo:
  # se activa con "docker compose --profile dev up -d". En el servidor, identidad usa un SMTP real.
  # Interfaz web: http://localhost:50303   |   SMTP: puerto 50302
  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit
    container_name: comondurismo-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-50302}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-50303}:8025"
    networks:
      - comondurismo-network

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  # Red compartida de todos los contenedores, con nombre fijo para que otros compose (por
  # ejemplo los de desarrollo de cada servicio) se conecten a ella como "externa".
  comondurismo-network:
    name: comondurismo-network
    driver: bridge
