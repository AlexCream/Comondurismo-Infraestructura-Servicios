# nginx DENTRO del contenedor "web": solo sirve los archivos estaticos de web/dist.
# TLS, dominio y el reparto /api/ y /media/ los hace el nginx del anfitrion (nota
# "Despliegue_y_Nginx"), que reenvia aqui todo lo demas (location /).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Archivos con hash en el nombre (JavaScript del bundle e imagenes/fuentes de assets):
    # cambian de nombre en cada version, se pueden guardar en cache para siempre.
    location ~ ^/(_expo/static|assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La pagina de entrada nunca se guarda en cache: asi el navegador toma la version nueva
    # justo despues de desplegar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Aplicacion de una sola pagina (expo "output": "single"): toda ruta que no sea un archivo
    # (/verify-email, /admin/..., etc.) la resuelve el enrutador del navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
