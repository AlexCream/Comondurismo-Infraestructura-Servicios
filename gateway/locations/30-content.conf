# Servicio de contenido (repo Comondurismo-Contenido-API, contenedor comondurismo-content).
#
# Las rutas se pasan SIN cambiar (no se quita ningun prefijo). Los prefijos no chocan con
# los de identidad (10-identity.conf): auth, users, roles, role-requests y admin/users.
#
# El servicio verifica los tokens con el JWKS de identidad, que lee por la red interna de
# Docker (no pasa por aqui).

# Carga de archivos multimedia (imagenes y videos): cuerpo grande y lectura lenta.
# Va ANTES del location general: nginx usa la primera expresion regular que coincide, en
# el orden en que aparecen.
location ~ "^/api/v1/manage/[a-z-]+/[0-9a-fA-F-]{36}/media$" {
    client_max_body_size 110m;
    client_body_timeout 120s;
    proxy_request_buffering off;

    set $content_upstream http://comondurismo-content:8081;
    proxy_pass $content_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

location ~ ^/api/v1/(categories|subcategories|services|amenities|operation-modes|classifications|places|points-of-interest|activities|events|guides|businesses|search|map|sync|reports|manage)(/|$) {
    # Variable + resolver: ver el comentario del resolver en default.conf.template.
    set $content_upstream http://comondurismo-content:8081;
    proxy_pass $content_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# La verificacion de salud del servicio no se publica: es para Docker y el balanceador.
