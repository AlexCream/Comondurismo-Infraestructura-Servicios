# Servicio de identidad (repo Comondurismo-Backend-2026B, contenedor comondurismo-identity).
#
# Las rutas se pasan SIN cambiar (no se quita ningun prefijo), asi que el contrato
# documentado del servicio (docs/api-auth.md) es el mismo con o sin gateway:
#   POST /api/v1/auth/login   ->   http://comondurismo-identity:8080/api/v1/auth/login
#
# CORS lo resuelve el propio servicio (CORS_ALLOWED_ORIGINS); nginx no agrega cabeceras CORS.

location ~ ^/(api/v1/(auth|users|roles|role-requests|admin/users)(/|$)|\.well-known/jwks\.json$) {
    # Variable + resolver: ver el comentario del resolver en default.conf.template.
    # Con una variable, proxy_pass envia la URI original tal cual (con su query string).
    set $identity_upstream http://comondurismo-identity:8080;
    proxy_pass $identity_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

# La verificacion de salud del servicio no se publica: es para Docker y el balanceador.
