# Archivos multimedia (imagenes WebP y videos MP4) del servicio de contenido.
#
# El servicio guarda los archivos en el almacenamiento de objetos (compatible con S3) y devuelve sus
# URL como MEDIA_PUBLIC_BASE_URL + "/" + clave, por ejemplo:
#   http://localhost:8000/media/images/place/<id>/large.webp
# Aqui se traduce esa ruta al bucket. El nombre del bucket es OBJECT_STORE_BUCKET del
# servicio de contenido (por defecto, comondurismo-media).
#
# Solo lectura: GET y HEAD. Las claves de los objetos llevan un identificador unico y no
# cambian, asi que el navegador puede guardarlos mucho tiempo (el servicio fija
# Cache-Control al subirlos).
#
# En produccion lo habitual es servir el bucket por un CDN y apuntar MEDIA_PUBLIC_BASE_URL
# a el; este archivo entonces ya no hace falta.

location ^~ /media/ {
    limit_except GET HEAD {
        deny all;
    }

    set $media_upstream http://comondurismo-storage:9000;
    rewrite ^/media/(.*)$ /comondurismo-media/$1 break;
    proxy_pass $media_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # No se reenvian cookies ni cabeceras de autenticacion al almacenamiento.
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";

    # Se oculta lo que el almacenamiento anuncia de si mismo.
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header Server;
    proxy_hide_header x-amz-bucket-region;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
}
